name: Validate Brisa
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python3 scripts/test_data.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
